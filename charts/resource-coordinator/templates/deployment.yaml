apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resource-coordinator.fullname" . }}
  labels:
    {{- include "resource-coordinator.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "resource-coordinator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "resource-coordinator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "resource-coordinator.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: resource-coordinator
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 10700
              protocol: TCP
          env:
            - name: DB_HOSTNAME
              value: {{ required "database.hostname is required" .Values.database.hostname | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_NAME
              value: {{ required "database.name is required" .Values.database.name | quote }}
            - name: DB_USERNAME
              value: {{ required "database.username is required" .Values.database.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: APP_DEFAULT_LEASE_TTL_MINUTES
              value: {{ .Values.lease.defaultTtlMinutes | quote }}
            - name: APP_MAX_LEASE_TTL_MINUTES
              value: {{ .Values.lease.maxTtlMinutes | quote }}
            - name: APP_LEASE_CLEANUP_INTERVAL_MINUTES
              value: {{ .Values.lease.cleanupIntervalMinutes | quote }}
            - name: APP_LEASE_CLEANUP_ENABLED
              value: {{ .Values.lease.cleanupEnabled | quote }}
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
