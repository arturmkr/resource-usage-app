[project]
name = "resource-coordinator"
version = "0.1.0"
description = "API for coordinating exclusive access to shared resources"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.136.0,<1.0.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.0,<3.0.0",
    "sqlalchemy>=2.0.50,<2.1.0",
    "uvicorn[standard]>=0.47.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15",
    "testcontainers[postgres]>=4.14.2,<5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]
