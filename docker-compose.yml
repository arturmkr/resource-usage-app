services:
  app:
    build: .
    ports:
      - "10700:10700"
    environment:
      DB_HOSTNAME: db
      DB_PORT: 5432
      DB_USERNAME: userhub
      DB_PASSWORD: userhub
      DB_NAME: userhub
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: userhub
      POSTGRES_PASSWORD: userhub
      POSTGRES_DB: userhub
    volumes:
      - resource-usage-postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userhub -d userhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resource-usage-postgres-data:
